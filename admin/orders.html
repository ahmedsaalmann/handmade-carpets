<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة الطلبات | سجاد يدوي</title>
  <link rel="stylesheet" href="../css/styles.css">
  <script>
    if (localStorage.getItem('admin_auth') !== 'true') {
      window.location.href = 'login.html';
    }
    function logout() {
      localStorage.removeItem('admin_auth');
      window.location.href = 'login.html';
    }
  </script>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="sidebar">
      <div class="admin-sidebar-header"><h2>🏛️ سجاد يدوي</h2><p>لوحة التحكم</p></div>
      <nav class="admin-nav">
        <a href="index.html"><span class="icon">📊</span> الرئيسية</a>
        <a href="products.html"><span class="icon">🧶</span> المنتجات</a>
        <a href="orders.html" class="active"><span class="icon">📦</span> الطلبات</a>
        <a href="promo.html"><span class="icon">🎟️</span> الكوبونات</a>
        <a href="../index.html"><span class="icon">🌐</span> زيارة الموقع</a>
        <a href="#" onclick="logout()" style="color: var(--red); margin-top: auto;"><span class="icon">🚪</span> تسجيل الخروج</a>
      </nav>
    </aside>
    <main class="admin-main">
      <div class="admin-header">
        <h1>📦 إدارة الطلبات</h1>
        <div style="display: flex; gap: 1rem;">
          <button class="btn btn-outline" onclick="exportOrders()" style="background: white; border: 1px solid var(--cream-dark);">📥 تصدير Excel</button>
          <button class="btn btn-gold" onclick="openOrderModal()">+ إضافة طلب</button>
        </div>
      </div>
      <div class="admin-table-container">
        <div style="overflow-x:auto;">
          <table class="admin-table">
            <thead><tr><th>رقم التتبع</th><th>العميل</th><th>الهاتف</th><th>المنتج</th><th>المبلغ</th><th>الحالة</th><th>إجراءات</th></tr></thead>
            <tbody id="orders-tbody"><tr><td colspan="7"><div class="loading"><div class="spinner"></div></div></td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Order Modal -->
  <div class="modal-overlay" id="order-modal">
    <div class="modal">
      <div class="modal-header"><h3 id="order-modal-title">إضافة طلب جديد</h3><button class="modal-close" onclick="closeOrderModal()">✕</button></div>
      <div class="modal-body">
        <input type="hidden" id="o-edit-id">
        <div class="form-row">
          <div class="form-group"><label>اسم العميل *</label><input type="text" id="o-name"></div>
          <div class="form-group"><label>رقم الهاتف</label><input type="text" id="o-phone"></div>
        </div>
        <div class="form-group"><label>العنوان</label><input type="text" id="o-address"></div>
        <div class="form-row">
          <div class="form-group"><label>المنتج *</label><select id="o-product"></select></div>
          <div class="form-group"><label>الكمية</label><input type="number" id="o-qty" value="1" min="1"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>المبلغ الإجمالي</label><input type="number" id="o-total" step="0.01"></div>
          <div class="form-group"><label>ملاحظات</label><input type="text" id="o-notes"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-gold" onclick="saveOrder()">💾 حفظ</button>
        <button class="btn" onclick="closeOrderModal()" style="background:var(--cream-dark);">إلغاء</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script>
    let productsCache = [];
    let allOrdersData = [];

    async function loadOrders() {
      const tbody = document.getElementById('orders-tbody');
      try {
        const { data, error } = await db.from('orders').select('*, products(name)').order('created_at', { ascending: false });
        if (error) throw error;
        allOrdersData = data || [];
        if (!data || data.length === 0) { tbody.innerHTML = '<tr><td colspan="7" class="no-results">لا توجد طلبات</td></tr>'; return; }
        tbody.innerHTML = data.map(o => {
          let productsText = o.products?.name || '-';
          if (o.items && o.items.length > 0) {
            productsText = o.items.map(i => `${i.name} (x${i.quantity})`).join('<br>');
          }
          return `<tr>
          <td><strong>${o.tracking_number}</strong></td>
          <td>${o.customer_name}</td>
          <td>${o.customer_phone || '-'}</td>
          <td>${productsText}</td>
          <td>${formatPrice(o.total_price)}</td>
          <td>
            <select onchange="updateStatus('${o.id}', this.value)" style="padding:0.3rem 0.5rem;border-radius:6px;border:2px solid var(--cream-dark);font-family:inherit;font-weight:600;font-size:0.8rem;cursor:pointer;">
              ${['pending','processing','shipped','delivered','cancelled'].map(s => `<option value="${s}" ${o.status===s?'selected':''}>${getStatusLabel(s)}</option>`).join('')}
            </select>
          </td>
          <td><button class="btn btn-sm btn-red" onclick="deleteOrder('${o.id}')">🗑️</button></td>
        </tr>`;}).join('');
      } catch(e) { tbody.innerHTML = '<tr><td colspan="7" class="no-results">خطأ</td></tr>'; console.error(e); }
    }

    async function updateStatus(id, status) {
      try {
        const { error } = await db.from('orders').update({ status, updated_at: new Date().toISOString() }).eq('id', id);
        if (error) throw error;
        showToast('تم تحديث حالة الطلب');
        
        const order = allOrdersData.find(o => o.id === id);
        if (order && order.customer_phone) {
            setTimeout(() => {
              if (confirm('تم تحديث الحالة بنجاح. هل تريد إرسال إشعار للعميل عبر واتساب؟')) {
                  let phone = order.customer_phone.replace(/\D/g, '');
                  if (phone.startsWith('0')) phone = '2' + phone; 
                  
                  const msg = `مرحباً ${order.customer_name}،\nنود إعلامك أن طلبك رقم *${order.tracking_number}* أصبح الآن: *${getStatusLabel(status)}*.\n\nشكراً لاختيارك سجاد يدوي. 🏛️`;
                  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
              }
            }, 500);
        }
      } catch(e) { showToast('خطأ: ' + e.message, 'error'); }
    }

    async function loadProductsForSelect() {
      const { data } = await db.from('products').select('id, name, price').eq('is_available', true);
      productsCache = data || [];
      const sel = document.getElementById('o-product');
      sel.innerHTML = '<option value="">-- اختر منتج --</option>' + productsCache.map(p => `<option value="${p.id}" data-price="${p.price}">${p.name} (${formatPrice(p.price)})</option>`).join('');
    }

    function openOrderModal() {
      document.getElementById('order-modal-title').textContent = 'إضافة طلب جديد';
      document.getElementById('o-edit-id').value = '';
      ['o-name','o-phone','o-address','o-notes'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('o-qty').value = 1;
      document.getElementById('o-total').value = '';
      loadProductsForSelect();
      document.getElementById('order-modal').classList.add('show');
    }
    function closeOrderModal() { document.getElementById('order-modal').classList.remove('show'); }

    // Auto-fill total when product changes
    document.addEventListener('change', e => {
      if (e.target.id === 'o-product') {
        const opt = e.target.selectedOptions[0];
        const price = parseFloat(opt?.dataset?.price || 0);
        const qty = parseInt(document.getElementById('o-qty').value) || 1;
        document.getElementById('o-total').value = (price * qty).toFixed(2);
      }
    });

    function generateTrackingNumber() {
      const y = new Date().getFullYear();
      const r = String(Math.floor(Math.random() * 9000) + 1000);
      return `TRK-${y}-${r}`;
    }

    async function saveOrder() {
      const order = {
        customer_name: document.getElementById('o-name').value.trim(),
        customer_phone: document.getElementById('o-phone').value.trim(),
        customer_address: document.getElementById('o-address').value.trim(),
        product_id: document.getElementById('o-product').value || null,
        quantity: parseInt(document.getElementById('o-qty').value) || 1,
        total_price: parseFloat(document.getElementById('o-total').value) || 0,
        notes: document.getElementById('o-notes').value.trim(),
        tracking_number: generateTrackingNumber(),
        status: 'pending'
      };
      if (!order.customer_name) { showToast('يرجى إدخال اسم العميل', 'error'); return; }
      try {
        const { error } = await db.from('orders').insert(order);
        if (error) throw error;
        showToast('تم إضافة الطلب بنجاح - رقم التتبع: ' + order.tracking_number);
        closeOrderModal();
        loadOrders();
      } catch(e) { showToast('خطأ: ' + e.message, 'error'); console.error(e); }
    }

    async function deleteOrder(id) {
      if (!confirm('هل أنت متأكد من حذف هذا الطلب؟')) return;
      try {
        const { error } = await db.from('orders').delete().eq('id', id);
        if (error) throw error;
        showToast('تم حذف الطلب');
        loadOrders();
      } catch(e) { showToast('خطأ: ' + e.message, 'error'); }
    }

    function exportOrders() {
      if (!allOrdersData || allOrdersData.length === 0) return showToast('لا توجد بيانات للتصدير', 'error');
      const headers = ['رقم التتبع', 'اسم العميل', 'رقم الهاتف', 'العنوان', 'المنتجات', 'الإجمالي', 'الحالة', 'ملاحظات', 'تاريخ الطلب'];
      const rows = [headers];
      allOrdersData.forEach(o => {
        let productsText = o.products?.name || '';
        if (o.items && o.items.length > 0) {
          productsText = o.items.map(i => `${i.name} (x${i.quantity})`).join(' | ');
        }
        rows.push([
          o.tracking_number,
          o.customer_name,
          o.customer_phone || '',
          o.customer_address || '',
          productsText,
          o.total_price,
          getStatusLabel(o.status),
          o.notes || '',
          new Date(o.created_at).toLocaleString('ar-EG')
        ]);
      });
      exportToCSV('orders.csv', rows);
    }

    document.addEventListener('DOMContentLoaded', loadOrders);
  </script>
</body>
</html>
